{% extends "base.html" %}

{% block content %}
<div class="max-w-5xl mx-auto pb-32" x-data='{
    viewMode: "aisle", // "aisle" or "meal"
    hideChecked: false,
    flattened: {{ flattened_groceries | tojson | safe if flattened_groceries else "[]" }},
    customItems: {{ custom_groceries | tojson | safe if custom_groceries else "[]" }},
    mealGroups: {{ grocery_by_meal | tojson | safe if grocery_by_meal else "[]" }},

    getCategory(ingStr) {
        const s = (ingStr || "").toLowerCase();
        if (/apple|banana|berry|lemon|lime|orange|onion|garlic|shallot|scallion|potato|tomato|carrot|celery|lettuce|spinach|kale|arugula|herb|cilantro|parsley|basil|avocado|bell pepper|jalapeño|pepper|broccoli|cucumber|zucchini|mushroom|squash|ginger/i.test(s)) {
            return "Produce";
        }
        if (/chicken|beef|steak|ground meat|pork|bacon|sausage|fish|salmon|tuna|shrimp|turkey|lamb|tofu/i.test(s)) {
            return "Meat & Seafood";
        }
        if (/milk|cream|cheese|cheddar|parmesan|mozzarella|butter|yogurt|egg|sour cream/i.test(s)) {
            return "Dairy & Refrigerated";
        }
        if (/oil|olive oil|vinegar|salt|black pepper|paprika|cumin|oregano|thyme|rosemary|chili powder|cinnamon|sauce|soy sauce|mustard|mayo|ketchup|spice/i.test(s)) {
            return "Oils, Spices & Condiments";
        }
        return "Pantry & Dry Goods";
    },

    get categoryGroups() {
        const categories = ["Produce", "Meat & Seafood", "Dairy & Refrigerated", "Pantry & Dry Goods", "Oils, Spices & Condiments", "Custom Items"];
        const groups = {};
        categories.forEach(c => groups[c] = []);

        this.flattened.forEach(item => {
            const cat = this.getCategory(item.name);
            groups[cat].push(item);
        });

        this.customItems.forEach(item => {
            const cat = item.category || "Custom Items";
            if (!groups[cat]) groups[cat] = [];
            groups[cat].push(item);
        });

        return categories.filter(c => groups[c] && groups[c].length > 0).map(c => ({
            name: c,
            items: groups[c]
        }));
    },

    get totalItemsCount() {
        return this.flattened.length + this.customItems.length;
    },

    get remainingCount() {
        const uncheckFlat = this.flattened.filter(i => !i.checked).length;
        const uncheckCustom = this.customItems.filter(i => !i.checked).length;
        return uncheckFlat + uncheckCustom;
    },

    toggleItem(item) {
        const prev = item.checked;
        item.checked = !prev;

        fetch("/api/grocery/toggle_item", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: item.id })
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === "ok") {
                item.checked = data.checked;
            } else {
                item.checked = prev;
            }
        })
        .catch(e => {
            item.checked = prev;
            console.error(e);
        });
    },

    checkAll() {
        this.flattened.forEach(i => i.checked = true);
        this.customItems.forEach(i => i.checked = true);
        fetch("/api/grocery/check_all", { method: "POST" })
            .then(r => r.json())
            .then(d => {
                if (window.showToast) window.showToast("All items checked off!");
            });
    },

    uncheckAll() {
        this.flattened.forEach(i => i.checked = false);
        this.customItems.forEach(i => i.checked = false);
        fetch("/api/grocery/uncheck_all", { method: "POST" })
            .then(r => r.json())
            .then(d => {
                if (window.showToast) window.showToast("All items unchecked");
            });
    }
}'>

    <!-- Header -->
    <div class="mb-6 text-center">
        <h1 class="text-3xl font-black text-slate-800 tracking-tight">Grocery List</h1>
        <p class="text-xs text-stone-400 mt-1 font-medium">Ingredients from your upcoming meals and custom items</p>
    </div>

    {% include 'active_plan_nav.html' %}

    <!-- Controls Toolbar -->
    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-stone-200/80 mb-6 flex flex-col sm:flex-row items-center justify-between gap-3">
        <!-- View Mode Switcher -->
        <div class="flex items-center p-1 bg-stone-100/80 rounded-xl border border-stone-200/60 w-full sm:w-auto">
            <button type="button" @click="viewMode = 'aisle'"
                class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all"
                :class="viewMode === 'aisle' ? 'bg-white text-orange-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'">
                <i data-lucide="layers" class="w-3.5 h-3.5"></i>
                <span>By Aisle</span>
            </button>
            <button type="button" @click="viewMode = 'meal'"
                class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all"
                :class="viewMode === 'meal' ? 'bg-white text-orange-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'">
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                <span>By Meal</span>
            </button>
        </div>

        <!-- Right Side: Hide Checked & Add Item -->
        <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
            <button type="button" @click="hideChecked = !hideChecked"
                class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold border transition-colors"
                :class="hideChecked ? 'bg-orange-50 text-orange-700 border-orange-200' : 'bg-stone-50 text-slate-600 border-stone-200 hover:bg-stone-100'">
                <i :data-lucide="hideChecked ? 'eye-off' : 'eye'" class="w-3.5 h-3.5"></i>
                <span x-text="hideChecked ? 'Show Checked' : 'Hide Checked'"></span>
            </button>

            <button type="button" onclick="openAddCustomModal()"
                class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Add Item</span>
            </button>
        </div>
    </div>

    <!-- Empty State -->
    <template x-if="totalItemsCount === 0">
        <div class="bg-white rounded-3xl p-12 text-center border border-stone-200/80 shadow-sm my-8">
            <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="shopping-cart" class="w-8 h-8"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-800 mb-2">Your Grocery List is Empty!</h2>
            <p class="text-sm text-slate-500 max-w-md mx-auto mb-6">
                All upcoming meals are cooked or no meals are planned. Schedule meals on your calendar or add custom shopping items.
            </p>
            <div class="flex items-center justify-center gap-3">
                <a href="/calendar" class="px-5 py-2.5 bg-orange-600 text-white font-bold text-xs rounded-xl shadow-md transition">
                    Schedule Meals
                </a>
                <button onclick="openAddCustomModal()" class="px-5 py-2.5 bg-stone-100 text-slate-700 font-bold text-xs rounded-xl hover:bg-stone-200 transition">
                    + Add Custom Item
                </button>
            </div>
        </div>
    </template>

    <!-- VIEW 1: BY AISLE -->
    <div x-show="viewMode === 'aisle' && totalItemsCount > 0" class="grid grid-cols-1 md:grid-cols-2 gap-5 items-start">
        <template x-for="cat in categoryGroups" :key="cat.name">
            <div class="bg-white rounded-2xl shadow-sm border border-stone-200/80 overflow-hidden"
                x-show="!hideChecked || cat.items.some(it => !it.checked)">
                <!-- Aisle Header -->
                <div class="px-5 py-3.5 bg-stone-50/80 border-b border-stone-100 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-orange-500"></span>
                        <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-700" x-text="cat.name"></h2>
                    </div>
                    <span class="text-[11px] font-bold text-stone-400"
                        x-text="cat.items.filter(it => !it.checked).length + ' remaining'"></span>
                </div>

                <!-- Items -->
                <div class="p-2 divide-y divide-stone-100/80">
                    <template x-for="item in cat.items" :key="item.id">
                        <div class="flex items-center justify-between p-2.5 rounded-xl transition-all group hover:bg-stone-50/80"
                            x-show="!hideChecked || !item.checked">
                            
                            <div class="flex items-center gap-3 flex-grow cursor-pointer pr-3 min-w-0"
                                @click="toggleItem(item)">
                                <div class="w-5 h-5 rounded-lg border-2 flex items-center justify-center transition-all flex-shrink-0"
                                    :class="item.checked ? 'bg-orange-600 border-orange-600 text-white' : 'border-stone-300 bg-white group-hover:border-orange-400'">
                                    <i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]" x-show="item.checked"></i>
                                </div>
                                <div class="min-w-0">
                                    <p class="text-sm font-semibold transition-all truncate"
                                        :class="item.checked ? 'line-through text-stone-400' : 'text-slate-800'"
                                        x-text="item.name"></p>
                                    <template x-if="item.meal_name">
                                        <p class="text-[10px] text-stone-400 truncate"
                                            x-text="item.meal_name + ' • ' + (item.meal_type || '')"></p>
                                    </template>
                                </div>
                            </div>

                            <!-- Custom item delete or pantry button -->
                            <div class="flex items-center gap-1.5 flex-shrink-0">
                                <template x-if="item.id && item.id.startsWith('custom-')">
                                    <button type="button" @click.stop="deleteCustomItem(item.id)"
                                        class="p-1 text-slate-300 hover:text-red-500 rounded-lg hover:bg-red-50 transition">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <!-- VIEW 2: BY MEAL -->
    <div x-show="viewMode === 'meal' && totalItemsCount > 0" class="space-y-6">
        <template x-for="mg in mealGroups" :key="mg.date + '-' + mg.meal_type">
            <div class="bg-white rounded-2xl shadow-sm border border-stone-200/80 overflow-hidden"
                x-show="!hideChecked || mg.items.some(it => !it.checked)">
                <div class="px-5 py-3 bg-stone-50/80 border-b border-stone-100 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-orange-100 text-orange-700" x-text="mg.meal_type"></span>
                        <span class="text-xs font-bold text-slate-800" x-text="mg.meal_name"></span>
                    </div>
                    <span class="text-[11px] font-medium text-slate-400" x-text="mg.day_name + ', ' + mg.date"></span>
                </div>

                <div class="p-2 divide-y divide-stone-100/80">
                    <template x-for="item in mg.items" :key="item.id">
                        <div class="flex items-center justify-between p-2.5 rounded-xl transition-all group hover:bg-stone-50/80"
                            x-show="!hideChecked || !item.checked">
                            <div class="flex items-center gap-3 flex-grow cursor-pointer pr-3 min-w-0"
                                @click="toggleItem(item)">
                                <div class="w-5 h-5 rounded-lg border-2 flex items-center justify-center transition-all flex-shrink-0"
                                    :class="item.checked ? 'bg-orange-600 border-orange-600 text-white' : 'border-stone-300 bg-white group-hover:border-orange-400'">
                                    <i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]" x-show="item.checked"></i>
                                </div>
                                <span class="text-sm font-semibold transition-all truncate"
                                    :class="item.checked ? 'line-through text-stone-400' : 'text-slate-800'"
                                    x-text="item.name"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <!-- Sticky Bottom Bar -->
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-stone-200/90 px-4 py-3 flex items-center gap-3 max-w-lg w-[92%] justify-between">
        <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-700">
                <span x-text="remainingCount" class="text-orange-600 font-black"></span> items left
            </span>
        </div>

        <div class="flex items-center gap-2">
            <button type="button" @click="uncheckAll()"
                class="px-3 py-1.5 text-xs font-bold text-slate-600 hover:text-slate-900 hover:bg-stone-100 rounded-xl transition">
                Uncheck All
            </button>
            <button type="button" @click="checkAll()"
                class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-sm transition flex items-center gap-1.5">
                <i data-lucide="check-check" class="w-4 h-4"></i>
                <span>Check Off All</span>
            </button>
        </div>
    </div>

</div>

<!-- Add Custom Item Modal -->
<div id="addCustomModal" class="fixed inset-0 bg-stone-900/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-stone-200 overflow-hidden">
        <div class="p-5 border-b border-stone-100 flex justify-between items-center bg-stone-50/80">
            <h3 class="text-base font-bold text-slate-800">Add Grocery Item</h3>
            <button onclick="closeAddCustomModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-stone-200/60">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Item Name</label>
                <input type="text" id="customItemName" placeholder="e.g. Sourdough Bread or Oat Milk" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-orange-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Aisle Category</label>
                <select id="customItemCategory" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-700">
                    <option value="Produce">Produce</option>
                    <option value="Meat & Seafood">Meat & Seafood</option>
                    <option value="Dairy & Refrigerated">Dairy & Refrigerated</option>
                    <option value="Pantry & Dry Goods" selected>Pantry & Dry Goods</option>
                    <option value="Oils, Spices & Condiments">Oils, Spices & Condiments</option>
                    <option value="Custom Items">Other / Snacks</option>
                </select>
            </div>
            <div class="pt-2 flex justify-end gap-2">
                <button type="button" onclick="closeAddCustomModal()" class="px-4 py-2 text-xs font-bold text-slate-500 hover:bg-stone-100 rounded-xl transition">Cancel</button>
                <button type="button" onclick="submitCustomItem()" class="px-5 py-2 text-xs font-bold bg-orange-600 hover:bg-orange-700 text-white rounded-xl shadow-md transition">Add Item</button>
            </div>
        </div>
    </div>
</div>

<script>
    function openAddCustomModal() {
        document.getElementById('customItemName').value = '';
        document.getElementById('addCustomModal').classList.remove('hidden');
        document.getElementById('customItemName').focus();
    }

    function closeAddCustomModal() {
        document.getElementById('addCustomModal').classList.add('hidden');
    }

    function submitCustomItem() {
        const name = document.getElementById('customItemName').value.trim();
        const category = document.getElementById('customItemCategory').value;
        if (!name) {
            if (window.showToast) window.showToast('Please enter an item name', 'error');
            return;
        }

        fetch('/api/grocery/add_item', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, category: category })
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                closeAddCustomModal();
                if (window.showToast) window.showToast('Item added to grocery list!');
                window.location.reload();
            } else {
                if (window.showToast) window.showToast(data.message || 'Error adding item', 'error');
            }
        })
        .catch(err => console.error(err));
    }

    function deleteCustomItem(itemId) {
        fetch('/api/grocery/delete_custom/' + encodeURIComponent(itemId), {
            method: 'POST'
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                if (window.showToast) window.showToast('Item deleted');
                window.location.reload();
            }
        })
        .catch(err => console.error(err));
    }
</script>
{% endblock %}
